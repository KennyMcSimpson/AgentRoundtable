name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        shell: bash
        run: |
          find lib app sim contract dist ui room.mjs -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) | while read -r f; do node --check "$f"; done
      - name: Unit, case and mutation tests
        shell: bash
        env:
          ROOM_DEV_HOME: ${{ runner.temp }}/room-dev
        run: node --test "test/**/*.test.mjs"
      - name: End-to-end (scripted seats, real service process)
        shell: bash
        env:
          ROOM_DEV_HOME: ${{ runner.temp }}/room-dev
        run: node test/e2e.mjs
      # test/real/ holds integration scenarios that require real agents or a dedicated VM.
      # They are run by maintainers locally before a release; see test/real/README.md.
