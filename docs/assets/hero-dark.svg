<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">AgentRoundtable — Governed multi-agent roundtable</title>
  <desc id="desc">Governed multi-agent roundtable for the coding agents you already run: Zero Dependencies, Local-First SSE, Governance Without Control.</desc>
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0f13"/>
      <stop offset="55%" stop-color="#10131a"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="glow-indigo" cx="205" cy="160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c86ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d0f13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="1010" cy="280" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0d0f13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="205" cy="160" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c86ff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#7c86ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c86ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="135" y1="90" x2="275" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c86ff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e07a5f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="divider-grad" x1="0" y1="54" x2="0" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dot-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect width="1200" height="320" fill="url(#bg-dark)"/>
    <rect width="1200" height="320" fill="url(#dot-grid-dark)"/>
    <rect width="1200" height="320" fill="url(#glow-indigo)"/>
    <rect width="1200" height="320" fill="url(#glow-emerald)"/>

    <!-- Subtle top-right version tag -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#64748b">
      <text x="1152" y="42" text-anchor="end">v0.2 · MIT · NODE &gt;= 22</text>
    </g>

    <!-- Left Roundtable Constellation Emblem -->
    <g transform="translate(0, 0)">
      <!-- Outer governance boundary ring -->
      <circle cx="205" cy="160" r="102" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="3 6"/>
      <circle cx="205" cy="160" r="85" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

      <!-- Main circular roundtable ring -->
      <circle cx="205" cy="160" r="68" fill="none" stroke="url(#ring-grad)" stroke-width="1.6"/>
      <circle cx="205" cy="160" r="68" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="6"/>

      <!-- Curved orbital communication arcs to central core -->
      <g fill="none" stroke-width="1.35" stroke-linecap="round">
        <path d="M 205 92 Q 218 126 205 160" stroke="#7c86ff" stroke-opacity="0.55"/>
        <path d="M 270 139 Q 242 162 205 160" stroke="#34d399" stroke-opacity="0.55"/>
        <path d="M 245 215 Q 213 196 205 160" stroke="#38bdf8" stroke-opacity="0.55"/>
        <path d="M 165 215 Q 173 178 205 160" stroke="#fbbf24" stroke-opacity="0.55"/>
        <path d="M 140 139 Q 178 138 205 160" stroke="#e07a5f" stroke-opacity="0.55"/>
      </g>

      <!-- Deterministic Governance Core -->
      <circle cx="205" cy="160" r="42" fill="url(#core-glow)"/>
      <circle cx="205" cy="160" r="21" fill="#131722" stroke="#7c86ff" stroke-opacity="0.55" stroke-width="1.25"/>
      <circle cx="205" cy="160" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
      <rect x="199" y="154" width="12" height="12" rx="2.5" transform="rotate(45 205 160)" fill="#1d2336" stroke="#c7d2fe" stroke-width="1.4"/>
      <circle cx="205" cy="160" r="2.6" fill="#ffffff"/>

      <!-- 5 Luminous Agent Nodes -->
      <!-- Top: Antigravity (#7c86ff) -->
      <g>
        <circle cx="205" cy="92" r="13" fill="#7c86ff" fill-opacity="0.18"/>
        <circle cx="205" cy="92" r="7.5" fill="#10131a" stroke="#7c86ff" stroke-width="2"/>
        <circle cx="205" cy="92" r="3.4" fill="#7c86ff"/>
      </g>
      <!-- Upper-Right: Codex (#34d399) -->
      <g>
        <circle cx="270" cy="139" r="13" fill="#34d399" fill-opacity="0.18"/>
        <circle cx="270" cy="139" r="7.5" fill="#10131a" stroke="#34d399" stroke-width="2"/>
        <circle cx="270" cy="139" r="3.4" fill="#34d399"/>
      </g>
      <!-- Lower-Right: Gemini (#38bdf8) -->
      <g>
        <circle cx="245" cy="215" r="13" fill="#38bdf8" fill-opacity="0.18"/>
        <circle cx="245" cy="215" r="7.5" fill="#10131a" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="245" cy="215" r="3.4" fill="#38bdf8"/>
      </g>
      <!-- Lower-Left: Pi (#fbbf24) -->
      <g>
        <circle cx="165" cy="215" r="13" fill="#fbbf24" fill-opacity="0.18"/>
        <circle cx="165" cy="215" r="7.5" fill="#10131a" stroke="#fbbf24" stroke-width="2"/>
        <circle cx="165" cy="215" r="3.4" fill="#fbbf24"/>
      </g>
      <!-- Upper-Left: Claude (#e07a5f) -->
      <g>
        <circle cx="140" cy="139" r="13" fill="#e07a5f" fill-opacity="0.18"/>
        <circle cx="140" cy="139" r="7.5" fill="#10131a" stroke="#e07a5f" stroke-width="2"/>
        <circle cx="140" cy="139" r="3.4" fill="#e07a5f"/>
      </g>

      <!-- Subtle seat node labels -->
      <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.02em" fill="#94a3b8">
        <text x="205" y="68" text-anchor="middle">Antigravity</text>
        <text x="291" y="143" text-anchor="start">Codex</text>
        <text x="264" y="232" text-anchor="start">Gemini</text>
        <text x="146" y="232" text-anchor="end">Pi</text>
        <text x="119" y="143" text-anchor="end">Claude</text>
      </g>
    </g>

    <!-- Subtle vertical separator -->
    <line x1="362" y1="54" x2="362" y2="266" stroke="url(#divider-grad)" stroke-width="1"/>

    <!-- Right Typography & Metadata Block -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- Overline -->
      <circle cx="404" cy="83" r="3.5" fill="#34d399"/>
      <circle cx="404" cy="83" r="7" fill="#34d399" fill-opacity="0.18"/>
      <text x="418" y="87" font-size="11.5" font-weight="600" letter-spacing="0.15em" fill="#94a3b8">LOCAL MULTI-AGENT GOVERNANCE</text>

      <!-- Hero Title -->
      <text x="398" y="152" font-size="56" font-weight="750" letter-spacing="-0.03em" fill="url(#title-grad)">AgentRoundtable</text>

      <!-- Subtitle -->
      <text x="400" y="191" font-size="18.5" font-weight="400" fill="#9ca3af">Governed multi-agent roundtable for the coding agents you already run</text>

      <!-- Minimalist Pill Tags -->
      <g transform="translate(398, 222)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="174" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
        <circle cx="19" cy="17" r="3.5" fill="#34d399"/>
        <text x="32" y="21.5" font-size="13" font-weight="500" fill="#e2e8f0">Zero Dependencies</text>

        <!-- Pill 2 -->
        <rect x="188" y="0" width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
        <circle cx="207" cy="17" r="3.5" fill="#38bdf8"/>
        <text x="220" y="21.5" font-size="13" font-weight="500" fill="#e2e8f0">Local-First SSE</text>

        <!-- Pill 3 -->
        <rect x="358" y="0" width="236" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
        <circle cx="377" cy="17" r="3.5" fill="#7c86ff"/>
        <text x="390" y="21.5" font-size="13" font-weight="500" fill="#e2e8f0">Governance Without Control</text>
      </g>
    </g>
  </g>

  <!-- Crisp hairline outer border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
</svg>
