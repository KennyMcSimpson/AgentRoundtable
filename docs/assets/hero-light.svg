<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 284" width="1200" height="284" role="img" aria-labelledby="hero-title-l hero-desc-l">
  <title id="hero-title-l">AgentRoundtable — Governed multi-agent roundtable (Light)</title>
  <desc id="hero-desc-l">Editorial title plate for AgentRoundtable: governed multi-agent roundtable for the coding agents you already run, with zero npm dependencies, local-first SSE, and governance without control.</desc>

  <!-- Warm unbleached paper canvas, crisp 1px outer frame -->
  <rect x="0.5" y="0.5" width="1199" height="283" rx="10" fill="#f6f4ee" stroke="#dedad0" stroke-width="1"/>

  <!-- Top masthead rule & catalog metadata -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.12em" fill="#76736b">
    <text x="52" y="37">LOCAL MULTI-AGENT GOVERNANCE</text>
    <text x="1148" y="37" text-anchor="end">v0.3.0  /  MIT  /  NODE &gt;= 22</text>
  </g>
  <line x1="52" y1="52" x2="1148" y2="52" stroke="#dedad0" stroke-width="1"/>

  <!-- Left Editorial Typography Block -->
  <g>
    <text x="50" y="136" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Cambria, serif" font-size="58" font-weight="400" letter-spacing="-0.025em" fill="#191816">AgentRoundtable</text>
    <text x="52" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="17.5" font-weight="400" fill="#524f49">Governed roundtable for the coding agents you already run.</text>
  </g>

  <!-- Bottom typographic spec line (hairline rule, zero pill soup) -->
  <line x1="52" y1="214" x2="770" y2="214" stroke="#dedad0" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#44423d">
    <text x="52" y="242">0 npm dependencies</text>
    <text x="200" y="242" fill="#b4afa3">/</text>
    <text x="224" y="242">Local-first SSE</text>
    <text x="352" y="242" fill="#b4afa3">/</text>
    <text x="376" y="242">Governance without control</text>
  </g>

  <!-- Hairline vertical divider -->
  <line x1="808" y1="74" x2="808" y2="248" stroke="#e4e0d6" stroke-width="1"/>

  <!-- Right Minimalist Architectural Roundtable Line-Art Emblem -->
  <g>
    <!-- Outer dashed measure ring & solid table ring -->
    <circle cx="984" cy="160" r="72" fill="none" stroke="#d9d4c8" stroke-width="1" stroke-dasharray="2 5"/>
    <circle cx="984" cy="160" r="54" fill="none" stroke="#191816" stroke-width="1.25"/>

    <!-- Fine radial spokes from 5 seats toward central governance core -->
    <g stroke="#c7c2b6" stroke-width="1">
      <line x1="984" y1="106" x2="984" y2="142"/>
      <line x1="1035" y1="143" x2="1001" y2="154"/>
      <line x1="1016" y1="204" x2="995" y2="175"/>
      <line x1="952" y1="204" x2="973" y2="175"/>
      <line x1="933" y1="143" x2="967" y2="154"/>
    </g>

    <!-- Central governance mark — single warm terracotta focal accent -->
    <circle cx="984" cy="160" r="14" fill="#f6f4ee" stroke="#191816" stroke-width="1.25"/>
    <circle cx="984" cy="160" r="5" fill="#b55939"/>

    <!-- 5 monochrome geometric seats on the perimeter -->
    <g fill="#f6f4ee" stroke="#191816" stroke-width="1.5">
      <circle cx="984" cy="106" r="5"/>
      <circle cx="1035" cy="143" r="5"/>
      <circle cx="1016" cy="204" r="5"/>
      <circle cx="952" cy="204" r="5"/>
      <circle cx="933" cy="143" r="5"/>
    </g>

    <!-- Quiet monospace seat labels -->
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#635f57">
      <text x="984" y="78" text-anchor="middle">Claude</text>
      <text x="1062" y="146" text-anchor="start">Codex</text>
      <text x="1040" y="222" text-anchor="start">Antigravity</text>
      <text x="928" y="222" text-anchor="end">Gemini</text>
      <text x="906" y="146" text-anchor="end">Pi</text>
    </g>
  </g>
</svg>
