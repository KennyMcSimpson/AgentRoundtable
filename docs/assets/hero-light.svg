<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">AgentRoundtable — Governed multi-agent roundtable</title>
  <desc id="desc">Governed multi-agent roundtable for the coding agents you already run: Zero Dependencies, Local-First SSE, Governance Without Control.</desc>
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="55%" stop-color="#fbfcfd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow-indigo-light" cx="205" cy="160" r="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.11"/>
      <stop offset="58%" stop-color="#818cf8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald-light" cx="1010" cy="285" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.09"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow-light" cx="205" cy="160" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad-light" x1="135" y1="90" x2="275" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b64f5" stop-opacity="0.72"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d96548" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="divider-grad-light" x1="0" y1="54" x2="0" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dot-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect width="1200" height="320" fill="url(#bg-light)"/>
    <rect width="1200" height="320" fill="url(#dot-grid-light)"/>
    <rect width="1200" height="320" fill="url(#glow-indigo-light)"/>
    <rect width="1200" height="320" fill="url(#glow-emerald-light)"/>

    <!-- Subtle top-right version tag -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#64748b">
      <text x="1152" y="42" text-anchor="end">v0.2 · MIT · NODE &gt;= 22</text>
    </g>

    <!-- Left Roundtable Constellation Emblem -->
    <g transform="translate(0, 0)">
      <!-- Outer governance boundary ring -->
      <circle cx="205" cy="160" r="102" fill="none" stroke="#0f172a" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="3 6"/>
      <circle cx="205" cy="160" r="85" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1"/>

      <!-- Main circular roundtable ring -->
      <circle cx="205" cy="160" r="68" fill="none" stroke="url(#ring-grad-light)" stroke-width="1.8"/>
      <circle cx="205" cy="160" r="68" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="6"/>

      <!-- Curved orbital communication arcs to central core -->
      <g fill="none" stroke-width="1.4" stroke-linecap="round">
        <path d="M 205 92 Q 218 126 205 160" stroke="#5b64f5" stroke-opacity="0.52"/>
        <path d="M 270 139 Q 242 162 205 160" stroke="#10b981" stroke-opacity="0.52"/>
        <path d="M 245 215 Q 213 196 205 160" stroke="#0284c7" stroke-opacity="0.52"/>
        <path d="M 165 215 Q 173 178 205 160" stroke="#d97706" stroke-opacity="0.52"/>
        <path d="M 140 139 Q 178 138 205 160" stroke="#d96548" stroke-opacity="0.52"/>
      </g>

      <!-- Deterministic Governance Core -->
      <circle cx="205" cy="160" r="42" fill="url(#core-glow-light)"/>
      <circle cx="205" cy="160" r="21" fill="#ffffff" stroke="#5b64f5" stroke-opacity="0.55" stroke-width="1.35"/>
      <circle cx="205" cy="160" r="14" fill="none" stroke="#0f172a" stroke-opacity="0.10" stroke-width="1"/>
      <rect x="199" y="154" width="12" height="12" rx="2.5" transform="rotate(45 205 160)" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
      <circle cx="205" cy="160" r="2.6" fill="#4f46e5"/>

      <!-- 5 Agent Nodes -->
      <!-- Top: Antigravity (#5b64f5) -->
      <g>
        <circle cx="205" cy="92" r="13" fill="#5b64f5" fill-opacity="0.13"/>
        <circle cx="205" cy="92" r="7.5" fill="#ffffff" stroke="#5b64f5" stroke-width="2.1"/>
        <circle cx="205" cy="92" r="3.4" fill="#5b64f5"/>
      </g>
      <!-- Upper-Right: Codex (#10b981) -->
      <g>
        <circle cx="270" cy="139" r="13" fill="#10b981" fill-opacity="0.13"/>
        <circle cx="270" cy="139" r="7.5" fill="#ffffff" stroke="#10b981" stroke-width="2.1"/>
        <circle cx="270" cy="139" r="3.4" fill="#10b981"/>
      </g>
      <!-- Lower-Right: Gemini (#0284c7) -->
      <g>
        <circle cx="245" cy="215" r="13" fill="#0284c7" fill-opacity="0.13"/>
        <circle cx="245" cy="215" r="7.5" fill="#ffffff" stroke="#0284c7" stroke-width="2.1"/>
        <circle cx="245" cy="215" r="3.4" fill="#0284c7"/>
      </g>
      <!-- Lower-Left: Pi (#d97706) -->
      <g>
        <circle cx="165" cy="215" r="13" fill="#d97706" fill-opacity="0.13"/>
        <circle cx="165" cy="215" r="7.5" fill="#ffffff" stroke="#d97706" stroke-width="2.1"/>
        <circle cx="165" cy="215" r="3.4" fill="#d97706"/>
      </g>
      <!-- Upper-Left: Claude (#d96548) -->
      <g>
        <circle cx="140" cy="139" r="13" fill="#d96548" fill-opacity="0.13"/>
        <circle cx="140" cy="139" r="7.5" fill="#ffffff" stroke="#d96548" stroke-width="2.1"/>
        <circle cx="140" cy="139" r="3.4" fill="#d96548"/>
      </g>

      <!-- Subtle seat node labels -->
      <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.02em" fill="#475569">
        <text x="205" y="68" text-anchor="middle">Antigravity</text>
        <text x="291" y="143" text-anchor="start">Codex</text>
        <text x="264" y="232" text-anchor="start">Gemini</text>
        <text x="146" y="232" text-anchor="end">Pi</text>
        <text x="119" y="143" text-anchor="end">Claude</text>
      </g>
    </g>

    <!-- Subtle vertical separator -->
    <line x1="362" y1="54" x2="362" y2="266" stroke="url(#divider-grad-light)" stroke-width="1"/>

    <!-- Right Typography & Metadata Block -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- Overline -->
      <circle cx="404" cy="83" r="3.5" fill="#10b981"/>
      <circle cx="404" cy="83" r="7" fill="#10b981" fill-opacity="0.16"/>
      <text x="418" y="87" font-size="11.5" font-weight="600" letter-spacing="0.15em" fill="#475569">LOCAL MULTI-AGENT GOVERNANCE</text>

      <!-- Hero Title -->
      <text x="398" y="152" font-size="56" font-weight="750" letter-spacing="-0.03em" fill="#111827">AgentRoundtable</text>

      <!-- Subtitle -->
      <text x="400" y="191" font-size="18.5" font-weight="400" fill="#475569">Governed multi-agent roundtable for the coding agents you already run</text>

      <!-- Minimalist Pill Tags -->
      <g transform="translate(398, 222)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="174" height="34" rx="17" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.10" stroke-width="1"/>
        <circle cx="19" cy="17" r="3.5" fill="#10b981"/>
        <text x="32" y="21.5" font-size="13" font-weight="500" fill="#1e293b">Zero Dependencies</text>

        <!-- Pill 2 -->
        <rect x="188" y="0" width="156" height="34" rx="17" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.10" stroke-width="1"/>
        <circle cx="207" cy="17" r="3.5" fill="#0284c7"/>
        <text x="220" y="21.5" font-size="13" font-weight="500" fill="#1e293b">Local-First SSE</text>

        <!-- Pill 3 -->
        <rect x="358" y="0" width="236" height="34" rx="17" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.10" stroke-width="1"/>
        <circle cx="377" cy="17" r="3.5" fill="#5b64f5"/>
        <text x="390" y="21.5" font-size="13" font-weight="500" fill="#1e293b">Governance Without Control</text>
      </g>
    </g>
  </g>

  <!-- Crisp hairline outer border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#0f172a" stroke-opacity="0.09" stroke-width="1"/>
</svg>
